services:
  - type: web
    name: nisr-sdg-automation-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: ADMIN_COOKIE_SECURE
        value: "true"
      - key: ADMIN_COOKIE_SAMESITE
        value: none
      - key: BACKEND_CORS_ORIGINS
        value: https://sdgs-dashboard.github.io,http://localhost:3000,http://127.0.0.1:3000
      - key: DATABASE_URL
        fromDatabase:
          name: nisr-sdg-automation-db
          property: connectionString

databases:
  - name: nisr-sdg-automation-db
    plan: free
