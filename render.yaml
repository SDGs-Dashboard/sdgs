services:
  - type: web
    name: nisr-sdg-automation-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: ADMIN_COOKIE_SECURE
        value: "true"
      - key: ADMIN_COOKIE_SAMESITE
        value: none
      - key: BACKEND_CORS_ORIGINS
        value: https://sdgs-dashboard.github.io,http://localhost:3000,http://127.0.0.1:3000
      - key: DATABASE_URL
        fromDatabase:
          name: nisr-sdg-automation-db
          property: connectionString
      - key: AI_PROVIDER
        value: auto
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-oss-20b:free
      - key: OPENROUTER_MODEL_FALLBACKS
        value: openrouter/free,openai/gpt-oss-120b:free,deepseek/deepseek-v4-flash:free

databases:
  - name: nisr-sdg-automation-db
    plan: free
